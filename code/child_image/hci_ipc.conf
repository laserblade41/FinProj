# Network core configuration — Bluetooth HCI IPC Controller
# This image runs on the nRF5340 network core (cpunet) and provides
# the BLE Controller to the application core over the IPC mailbox.

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_RESERVE=1

CONFIG_BT_MAX_CONN=4
CONFIG_BT_CTLR_TX_BUFFERS=10
CONFIG_BT_CTLR_RX_BUFFERS=10

# Privacy / address rotation
CONFIG_BT_CTLR_PRIVACY=y

# LE Secure Connections pairing
CONFIG_BT_CTLR_LE_ENC=y

# Required IPC transport
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# Logging (disable on network core for production)
CONFIG_LOG=n
