# =============================================================================
# FinWatch — nRF5340 smartwatch (NCS v3.2.1)
# =============================================================================
# Rules:
#  - No inline comments after values (Kconfig treats them as part of the value)
#  - Symbols auto-selected by DT (e.g. MFD_NPM1300) must NOT be set here

# ---- Debug / UART console ----
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
# 0=off 1=ERR 2=WRN 3=INF 4=DBG
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- Buses ----
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y

# ---- Input subsystem (touch + buttons) ----
CONFIG_INPUT=y
# NCS >= 4.4: rename to CONFIG_INPUT_CST8XX=y
CONFIG_INPUT_CST816S=y

# ---- Display: MIPI DBI + GC9A01 ----
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_GC9X01X=y

# ---- LVGL ----
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
# LV_Z_DISPLAY_DEV_PATH removed — NCS v3.2.1 auto-discovers from zephyr,display chosen node
CONFIG_LV_Z_MEM_POOL_SIZE=65536
# mipi_dbi_spi.c uses blocking spi_write(), so double-buffering (LV_Z_DOUBLE_VDB)
# gives no real parallelism — rendering can't overlap a blocking flush anyway.
# A single full-frame buffer instead means one render+flush pass per screen
# update rather than several chunked ones, which is what was causing choppy
# full-screen slide animations. 240x240x2 bytes = 115200 B for one buffer.
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_LV_Z_FULL_REFRESH=y

# ---- Built-in LVGL fonts used by watchface.c ----
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_14=y

# ---- Sensors: BMI270 ----
# The Bosch driver exposes the sensor's any-motion feature as SENSOR_TRIG_MOTION
# on INT1, so unlike the previous part we let the driver own the interrupt
# instead of programming the feature registers by hand. The CPU stays asleep
# until the wrist actually moves.
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# ---- PMIC: npm1300 ----
# MFD_NPM1300 / REGULATOR_NPM1300 / CHARGER_NPM1300 are auto-selected
# from the DT compatible strings — do NOT set them here in NCS v3.2.1.
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_CHARGER=y

# ---- External SPI NOR flash (MX25U51245G) ----
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_MINIMAL=y
# Allow flash_area_open() to resolve DT_FIXED_PARTITION_ID() values directly,
# bypassing the NCS PM macro override for external flash DT partitions.
CONFIG_FLASH_MAP_LABELS=y

# ---- LittleFS on external flash ----
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# ---- Counter API (LFXO RTC) ----
CONFIG_COUNTER=y

# ---- Modular expansion port (I2C pogo pins) ----
# CRC gates subsys/crc, which provides crc16_ccitt() for descriptor integrity.
CONFIG_CRC=y
# Mock module on by default so the expansion UI is testable without hardware.
# Set to n to talk to a real module over i2c3.
CONFIG_FINWATCH_EXPANSION_MOCK=y

# ---- Bluetooth LE ----
# BT_HCI_IPC is auto-selected by the nRF5340 board Kconfig
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="FinWatch"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
# Use NVS on the internal flash "storage" partition for BT settings —
# decouples bonding storage from the external SPI-NOR (which may not be
# mounted, e.g. during DK bring-up). Default backend would otherwise be
# SETTINGS_FILE (since CONFIG_FILE_SYSTEM=y), which needs /lfs mounted.
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_BAS=y
CONFIG_BT_GATT_SERVICE_CHANGED=y

# ---- Memory ----
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# ---- Power management ----
# CONFIG_PM is not available on nRF5340 in NCS v3.2.1 (HAS_PM=n).
# CONFIG_PM_DEVICE and CONFIG_PM_DEVICE_RUNTIME removed accordingly.
